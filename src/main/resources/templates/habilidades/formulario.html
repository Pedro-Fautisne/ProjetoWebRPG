<!DOCTYPE html>
<html lang="pt−BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário - Habilidade</title>
</head>
<body>
    <h1 th:text="${habilidade.id} != null ? 'Editar Habilidade' : 'Nova Habilidade'"></h1>

    <form th:if="${habilidade.id} == null" th:action="@{/habilidades}"
          method="post" th:object="${habilidade}">

        <label for="nome">Nome:</label>
        <input th:field="*{nome}" id="nome" type="text" required><br>

        <label for="tipo">Tipo:</label>
        <input th:field="*{tipo}" id="tipo" type="text" required><br>

        <label for="pre_requisitos">Pré-Requisitos:</label>
        <input th:field="*{pre_requisitos}" id="pre_requisitos" type="text"><br>

        <label for="descricao">Descrição:</label>
        <input th:field="*{descricao}" id="descricao" type="text" required><br>

        <!−− Erros por campo (mensagens do Bean Validation) −−>
        <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        <div th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
        <div th:if="${#fields.hasErrors('pre_requisitos')}" th:errors="*{pre_requisitos}"></div>
        <div th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        <button type="submit">Cadastrar</button>
        <a th:href="@{/habilidades}">Cancelar</a>
    </form>

    <form th:if="${habilidade.id} != null"
          th:action="@{/habilidades/{id}(id=${habilidade.id})}" method="post"
          th:object="${habilidade}">
        <input type="hidden" name="_method" value="put"/>

        <label for="nome1">Nome:</label>
        <input th:field="*{nome}" id="nome1" type="text" required><br>

        <label for="tipo1">Tipo:</label>
        <input th:field="*{tipo}" id="tipo1" type="text" required><br>

        <label for="pre_requisitos1">Pré-Requisitos:</label>
        <input th:field="*{pre_requisitos}" id="pre_requisitos1" type="text"><br>

        <label for="descricao1">Descrição:</label>
        <input th:field="*{descricao}" id="descricao1" type="text" required><br>

        <!−− Erros por campo (mensagens do Bean Validation) −−>
        <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        <div th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
        <div th:if="${#fields.hasErrors('pre_requisitos')}" th:errors="*{pre_requisitos}"></div>
        <div th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        <button type="submit">Atualizar</button>
        <a th:href="@{/clientes}">Cancelar</a>
    </form>
</body>
</html>
